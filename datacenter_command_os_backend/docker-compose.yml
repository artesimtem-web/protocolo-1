services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: datacenter
      POSTGRES_USER: dc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
    volumes:
      - dc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc_user -d datacenter"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://dc_user:${POSTGRES_PASSWORD:-change_me_before_deploy}@db:5432/datacenter
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dc_postgres_data:
